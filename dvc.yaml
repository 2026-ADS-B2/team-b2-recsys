stages:
  clean:
    cmd: python src/data/clean.py
    deps:
      - src/data/clean.py
      - data/raw
    outs:
      - data/processed/ratings.parquet
      - data/processed/movies.parquet
  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - data/processed/ratings.parquet
    params:
      - split.test_size
      - split.val_size
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - reports/split_sizes.json:
          cache: false
  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - data/processed/train.parquet
      - data/processed/movies.parquet
    params:
      - train.n
      - train.min_ratings
    outs:
      - reports/run.json:
          cache: false
  evaluate:
    cmd: python src/models/evaluate.py
    deps:
      - src/models/evaluate.py
      - reports/run.json
      - data/processed/test.parquet
    metrics:
      - reports/metrics.json:
          cache: false
  quality:
    cmd: python src/data/quality.py
    deps:
      - src/data/quality.py
      - data/raw/ratings.csv
      - data/raw/movies.csv
      - data/processed/ratings.parquet
      - data/processed/movies.parquet
    params:
      - quality
    outs:
      - reports/quality.json
  catalog:
    cmd: python src/data/catalog.py
    deps:
      - src/data/catalog.py
      - data/processed/movies.parquet
      - data/processed/ratings.parquet
      - data/raw/links.csv
    outs:
      - data/processed/catalog.parquet
