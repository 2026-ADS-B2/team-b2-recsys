stages:
  clean:
    cmd: python src/data/clean.py
    deps:
      - src/data/clean.py
      - data/raw
    outs:
      - data/processed/ratings.parquet
      - data/processed/movies.parquet
  split:
    cmd: python src/data/split.py
    deps:
      - src/data/split.py
      - data/processed/ratings.parquet
    params:
      - split.test_size
    outs:
      - data/processed/train.parquet
      - data/processed/test.parquet
  train:
    cmd: python src/models/train.py
    deps:
      - src/models/train.py
      - data/processed/train.parquet
      - data/processed/movies.parquet
    params:
      - train.n
      - train.min_ratings
    outs:
      - reports/run.json:
          cache: false
